services:
  claims-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claims_eb_backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ./.cache/ocr:/app/.cache/ocr
      - ./outputs:/app/outputs
    networks:
      - ocr-poc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  claims-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claims_eb_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ocr-poc
    depends_on:
      claims-backend:
        condition: service_healthy

networks:
  ocr-poc:
    name: ocr-poc
    external: true
